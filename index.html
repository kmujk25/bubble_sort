<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버블 정렬 시각화</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2430; --muted: #6b7280; --border: #e3e6eb;
    --bar: #5b8def; --compare: #f5a623; --swap: #e5484d; --sorted: #2fa36b;
    --code-bg: #f3f4f7; --hl: #fff4d6; --hl-border: #f5a623;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c; --card: #1e2128; --text: #e8eaef; --muted: #9aa1ad; --border: #2e323b;
      --bar: #6f9bf5; --compare: #f0b03f; --swap: #f06368; --sorted: #3dbb7f;
      --code-bg: #171a20; --hl: #3a3220; --hl-border: #f0b03f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 20px 8px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 20px 40px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  h2 { margin: 0 0 10px; font-size: 1.05rem; }

  /* 입력 */
  .input-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .input-row label { font-weight: 600; margin-right: 4px; }
  #arrInput {
    flex: 1 1 220px; min-width: 0; padding: 8px 10px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  #inputError { color: var(--swap); font-size: .9rem; width: 100%; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--bar); }
  button.primary { background: var(--bar); color: #fff; border-color: var(--bar); }
  button:disabled { opacity: .4; cursor: default; }

  /* 시각화 */
  .viz-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  #passBadge { font-weight: 700; font-size: 1.1rem; }
  #stepCounter { color: var(--muted); font-size: .9rem; }
  #stage { position: relative; height: 280px; margin-top: 12px; }
  .bar {
    position: absolute; bottom: 0; border-radius: 6px 6px 0 0; background: var(--bar);
    display: flex; align-items: flex-start; justify-content: center;
    transition-property: left, height, background-color; transition-timing-function: ease;
  }
  .bar span { color: #fff; font-weight: 700; padding-top: 6px; font-size: 1rem; }
  .bar.compare { background: var(--compare); }
  .bar.swap { background: var(--swap); }
  .bar.sorted { background: var(--sorted); }
  .pointer {
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    font-size: .8rem; font-weight: 700; color: var(--text); white-space: nowrap;
  }
  #indexRow { display: flex; border-top: 2px solid var(--border); }
  #indexRow div { flex: 1; text-align: center; color: var(--muted); font-size: .85rem; padding-top: 4px; font-family: ui-monospace, Consolas, monospace; }
  #message {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--bg);
    font-size: 1.02rem; min-height: 2.8em;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: .88rem; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* 컨트롤 */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .speed { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font-size: .9rem; }
  .hint { color: var(--muted); font-size: .85rem; width: 100%; }

  /* 코드 + 로그 */
  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } #stage { height: 220px; } }
  pre#code {
    margin: 0; background: var(--code-bg); border-radius: 8px; padding: 10px 0; overflow-x: auto;
    font-family: ui-monospace, "D2Coding", Consolas, monospace; font-size: .9rem;
  }
  .line { display: block; padding: 0 12px; border-left: 3px solid transparent; white-space: pre; }
  .line .ln { display: inline-block; width: 2em; color: var(--muted); user-select: none; }
  .line.active { background: var(--hl); border-left-color: var(--hl-border); }
  #vars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .var { background: var(--bg); border-radius: 8px; padding: 6px 8px; text-align: center; }
  .var .k { font-size: .8rem; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .var .v { font-size: 1.15rem; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; }
  tr.latest { background: var(--hl); }
  .cells { display: flex; gap: 4px; flex-wrap: wrap; }
  .cell {
    min-width: 30px; text-align: center; padding: 2px 4px; border-radius: 5px;
    background: var(--bg); font-family: ui-monospace, Consolas, monospace;
  }
  .cell.fixed { background: var(--sorted); color: #fff; font-weight: 700; }
  .console {
    margin-top: 12px; background: #111418; color: #d7dde5; border-radius: 8px; padding: 10px 12px;
    font-family: ui-monospace, Consolas, monospace; font-size: .85rem; white-space: pre; overflow-x: auto;
  }
  .console-title { margin-top: 14px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>버블 정렬 (Bubble Sort) 시각화</h1>
  <p>한 단계씩 넘기면서 인접한 두 값을 어떻게 비교하고 교환하는지, 각 회전이 끝날 때 배열이 어떻게 바뀌는지 확인해 보세요.</p>
</header>

<main>
  <section class="card">
    <div class="input-row">
      <label for="arrInput">배열 값</label>
      <input id="arrInput" value="24, 5, 7, 3, 20" aria-describedby="inputError">
      <button id="applyBtn" class="primary">적용</button>
      <button id="randomBtn">무작위 값</button>
      <div id="inputError"></div>
    </div>
  </section>

  <section class="card">
    <div class="viz-head">
      <div id="passBadge">정렬 전</div>
      <div id="stepCounter"></div>
    </div>
    <div id="stage"></div>
    <div id="indexRow"></div>
    <div id="message"></div>
    <div class="legend">
      <span><i style="background:var(--bar)"></i>정렬 안 됨</span>
      <span><i style="background:var(--compare)"></i>비교 중</span>
      <span><i style="background:var(--swap)"></i>교환</span>
      <span><i style="background:var(--sorted)"></i>자리 확정</span>
    </div>
  </section>

  <section class="card controls">
    <button id="firstBtn" title="처음으로">⏮ 처음</button>
    <button id="prevBtn" title="이전 단계 (←)">◀ 이전</button>
    <button id="playBtn" class="primary" title="자동 재생 (Space)">▶ 재생</button>
    <button id="nextBtn" title="다음 단계 (→)">다음 ▶</button>
    <button id="passBtn" title="현재 회전 끝까지">회전 끝으로 ⏭</button>
    <label class="speed">빠르게
      <input id="speed" type="range" min="250" max="2000" step="50" value="900" aria-label="재생 속도">
      느리게</label>
    <div class="hint">키보드: ← → 로 한 단계 이동, Space 로 재생/일시정지</div>
  </section>

  <div class="grid">
    <section class="card">
      <h2>C 코드 (현재 실행 중인 줄)</h2>
      <pre id="code"></pre>
      <div id="vars"></div>
    </section>
    <section class="card">
      <h2>회전별 결과</h2>
      <table>
        <thead><tr><th>회전</th><th>i</th><th>배열 상태 (초록 = 자리 확정)</th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
      <div class="console-title">C 프로그램 출력 화면</div>
      <div class="console" id="console"></div>
    </section>
  </div>
</main>

<script>
const CODE = [
  "void bubble_sort(int list[], int n)",
  "{",
  "    int i, j, temp;",
  "",
  "    for (i = n - 1; i > 0; i--) {",
  "        for (j = 0; j < i; j++) {",
  "            if (list[j] > list[j + 1]) {",
  "                temp = list[j];",
  "                list[j] = list[j + 1];",
  "                list[j + 1] = temp;",
  "            }",
  "        }",
  "        printf(\"%d회전 결과 : \", pass++);",
  "        print_array(list, n);",
  "    }",
  "}"
];

const $ = id => document.getElementById(id);
let steps = [], cur = 0, timer = null, barEls = {};

/* ---------- 정렬 단계 미리 계산 ---------- */
function buildSteps(values) {
  const list = values.map((v, k) => ({ id: k, v }));
  const n = list.length;
  const out = [];
  const log = [{ pass: 0, i: null, vals: values.slice(), fixedFrom: n }];
  const snap = () => list.map(o => ({ ...o }));
  const push = s => out.push({ arr: snap(), log: log.map(r => ({ ...r })), hl: [], j: null, ...s });

  push({ kind: 'start', i: null, sorted: n, lines: [1], badge: '정렬 전',
         msg: `정렬 전 배열입니다. 원소가 ${n}개이므로 n = ${n}, 회전은 최대 ${n - 1}번 합니다.` });

  for (let i = n - 1; i > 0; i--) {
    const pass = n - i;
    push({ kind: 'pass', i, sorted: i + 1, lines: [5], badge: `${pass}회전 (i = ${i})`,
           msg: `${pass}회전 시작: i = ${i}. list[0] ~ list[${i}] 사이에서 이웃한 두 값을 차례로 비교합니다.` });
    for (let j = 0; j < i; j++) {
      const a = list[j].v, b = list[j + 1].v, big = a > b;
      push({ kind: 'compare', i, j, hl: [j, j + 1], sorted: i + 1, lines: [6, 7], badge: `${pass}회전 (i = ${i})`,
             msg: `list[${j}] = ${a} 와 list[${j + 1}] = ${b} 비교 → ${a} > ${b} 는 <b>${big ? '참' : '거짓'}</b>` +
                  (big ? ', 두 값을 교환합니다.' : ', 그대로 둡니다.') });
      if (big) {
        [list[j], list[j + 1]] = [list[j + 1], list[j]];
        push({ kind: 'swap', i, j, hl: [j, j + 1], sorted: i + 1, lines: [8, 9, 10], badge: `${pass}회전 (i = ${i})`,
               msg: `교환 완료: 이제 list[${j}] = ${list[j].v}, list[${j + 1}] = ${list[j + 1].v} 입니다.` });
      }
    }
    log.push({ pass, i, vals: list.map(o => o.v), fixedFrom: i });
    push({ kind: 'passEnd', i, sorted: i, lines: [13, 14], badge: `${pass}회전 끝`,
           msg: `${pass}회전 끝: 비교한 범위에서 가장 큰 값 <b>${list[i].v}</b> 이(가) list[${i}] 자리로 이동해 확정되었습니다.` });
  }

  push({ kind: 'done', i: 0, sorted: 0, lines: [16], badge: '정렬 완료 🎉',
         msg: `정렬이 끝났습니다. 결과: ${list.map(o => o.v).join(' ')}` });
  return out;
}

/* ---------- 화면 그리기 ---------- */
function setupStage(values) {
  const stage = $('stage');
  stage.innerHTML = '';
  barEls = {};
  values.forEach((v, k) => {
    const el = document.createElement('div');
    el.className = 'bar';
    el.innerHTML = `<span>${v}</span>`;
    stage.appendChild(el);
    barEls[k] = el;
  });
  $('indexRow').innerHTML = values.map((_, k) => `<div>[${k}]</div>`).join('');
  $('code').innerHTML = CODE.map((t, k) =>
    `<span class="line" data-ln="${k + 1}"><span class="ln">${k + 1}</span>${escapeHtml(t)}</span>`).join('');
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function render() {
  const s = steps[cur];
  const n = s.arr.length;
  const stage = $('stage');
  const w = stage.clientWidth / n;
  const max = Math.max(...s.arr.map(o => o.v));
  const h = stage.clientHeight - 30;
  const dur = Math.min(0.45, speedMs() / 1000 * 0.6);

  s.arr.forEach((o, pos) => {
    const el = barEls[o.id];
    el.style.transitionDuration = dur + 's';
    el.style.left = (pos * w + w * 0.14) + 'px';
    el.style.width = (w * 0.72) + 'px';
    el.style.height = Math.max(28, (o.v / max) * h) + 'px';
    el.className = 'bar';
    if (pos >= s.sorted) el.classList.add('sorted');
    if (s.hl.includes(pos)) el.classList.add(s.kind === 'swap' ? 'swap' : 'compare');
    let ptr = '';
    if (s.j !== null && pos === s.j) ptr = 'j';
    if (s.j !== null && pos === s.j + 1) ptr = 'j+1';
    if (s.i !== null && s.kind !== 'done' && pos === s.i) ptr = ptr ? ptr + ' · i' : 'i';
    el.innerHTML = `<span>${o.v}</span>` + (ptr ? `<div class="pointer">${ptr}</div>` : '');
  });

  $('passBadge').textContent = s.badge;
  $('stepCounter').textContent = `단계 ${cur + 1} / ${steps.length}`;
  $('message').innerHTML = s.msg;

  document.querySelectorAll('#code .line').forEach(el =>
    el.classList.toggle('active', s.lines.includes(+el.dataset.ln)));

  const val = x => (x === null || x === undefined ? '–' : x);
  const lj = s.j !== null ? s.arr[s.j].v : null;
  const lj1 = s.j !== null ? s.arr[s.j + 1].v : null;
  $('vars').innerHTML = [['i', s.i], ['j', s.j], ['list[j]', lj], ['list[j+1]', lj1]]
    .map(([k, v]) => `<div class="var"><div class="k">${k}</div><div class="v">${val(v)}</div></div>`).join('');

  $('logBody').innerHTML = s.log.map((r, idx) => `
    <tr class="${idx === s.log.length - 1 ? 'latest' : ''}">
      <td>${r.pass === 0 ? '정렬 전' : r.pass + '회전'}</td>
      <td>${r.i === null ? '–' : r.i}</td>
      <td><div class="cells">${r.vals.map((v, k) =>
        `<span class="cell ${r.pass > 0 && k >= r.fixedFrom ? 'fixed' : ''}">${v}</span>`).join('')}</div></td>
    </tr>`).join('');

  const lines = s.log.map(r => (r.pass === 0 ? '정렬 전 데이터   : ' : `${r.pass}회전 결과 : `) + r.vals.join(' ') + ' ');
  if (s.kind === 'done') lines.push('버블 정렬 후 데이터 : ' + s.arr.map(o => o.v).join(' ') + ' ');
  $('console').textContent = lines.join('\n');

  $('firstBtn').disabled = $('prevBtn').disabled = cur === 0;
  $('nextBtn').disabled = $('passBtn').disabled = cur === steps.length - 1;
}

/* ---------- 조작 ---------- */
function speedMs() { return +$('speed').value; }
function go(k) { cur = Math.max(0, Math.min(steps.length - 1, k)); render(); }
function stop() { clearInterval(timer); timer = null; $('playBtn').textContent = '▶ 재생'; }
function play() {
  if (cur === steps.length - 1) go(0);
  $('playBtn').textContent = '⏸ 일시정지';
  timer = setInterval(() => {
    if (cur >= steps.length - 1) { stop(); return; }
    go(cur + 1);
  }, speedMs());
}
function toggle() { timer ? stop() : play(); }
function toPassEnd() {
  stop();
  let k = cur + 1;
  while (k < steps.length - 1 && steps[k].kind !== 'passEnd') k++;
  go(k);
}

function load(values) {
  stop();
  setupStage(values);
  steps = buildSteps(values);
  cur = 0;
  render();
}

function parseInput() {
  const raw = $('arrInput').value.split(/[,\s]+/).filter(Boolean);
  const nums = raw.map(Number);
  if (nums.some(x => !Number.isInteger(x))) return '정수만 입력해 주세요.';
  if (nums.length < 2 || nums.length > 10) return '값을 2개 이상 10개 이하로 입력해 주세요.';
  if (nums.some(x => x < 1 || x > 99)) return '1부터 99 사이의 값만 입력해 주세요.';
  return nums;
}

$('applyBtn').onclick = () => {
  const r = parseInput();
  if (typeof r === 'string') { $('inputError').textContent = r; return; }
  $('inputError').textContent = '';
  load(r);
};
$('arrInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('applyBtn').click(); });
$('randomBtn').onclick = () => {
  const n = 5 + Math.floor(Math.random() * 3);
  const vals = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 99));
  $('arrInput').value = vals.join(', ');
  $('inputError').textContent = '';
  load(vals);
};
$('firstBtn').onclick = () => { stop(); go(0); };
$('prevBtn').onclick = () => { stop(); go(cur - 1); };
$('nextBtn').onclick = () => { stop(); go(cur + 1); };
$('passBtn').onclick = toPassEnd;
$('playBtn').onclick = toggle;
$('speed').oninput = () => { if (timer) { stop(); play(); } };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
  else if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
  else if (e.key === ' ') { e.preventDefault(); toggle(); }
});
window.addEventListener('resize', render);

load([24, 5, 7, 3, 20]);
</script>
</body>
</html>
